<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>白骨开张 战场表现验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121b19;color:#f0e5cf;font:14px system-ui,sans-serif}main{max-width:1488px;margin:24px auto;padding:0 24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:0 0 8px}p{color:#b4b8a8;margin:4px 0 16px}button,select{font:inherit;background:#263932;color:#f0e5cf;border:1px solid #415148;min-height:40px;padding:8px 12px;border-radius:4px;cursor:pointer}button:hover{border-color:#d9aa59}.primary{background:#d9aa59;color:#18231c;font-weight:700}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#stage{width:100%;height:470px;border:1px solid #52634d;border-radius:8px;overflow:hidden;box-shadow:0 16px 48px #08120d}#status{white-space:pre-wrap;background:#1b2925;border:1px solid #415148;padding:12px;min-height:64px;font:12px ui-monospace,monospace}#roster{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}#roster span{padding:6px 8px;border-bottom:2px solid #7ec8a1;color:#b4b8a8}.notice{font-size:12px;color:#9fab98}
</style></head><body><main>
<header><div><h1>战场表现验收</h1><p>独立场景；使用正式战斗模块。此页面不是游戏入口。</p></div></header>
<nav><button id="prep">准备与拖放</button><button id="fight" class="primary">开始自动战斗</button><button id="pause">暂停</button><button id="next">下一批职业</button><button id="all-enemies">15类敌军预览</button><button id="stress">召唤压力战</button><select id="act"><option value="1">村庄夜路</option><option value="2">外城城墙</option><option value="3">王都城门</option></select><select id="height"><option value="470">470px 舞台</option><option value="320">320px 紧凑舞台</option><option value="620">620px 战斗舞台</option></select></nav>
<div id="stage"></div><div id="roster"></div><div id="status"></div><p class="notice">准备阶段可拖动场上士兵；也可先点士兵，再点部署格。数字和特效来自战斗事件。页面仅验证表现，不代表完整游戏或平衡验收。</p>
</main><script type="module" src="/src/render/demo.ts"></script></body></html>
